[ai]
provider = "gemini"
model = "gemini-3.1-pro-preview"
max_input_tokens = 950000
temperature = 1.0

[ai.gemini]
explicit_prompt_caching = false

[review]
# Reviews run concurrently up to this many patches. Sized for one developer's
# machine; the daemon's own Settings.toml uses a much larger fan-out.
concurrency = 4

# Remote MCP servers whose tools review stages may call (default: none).
# Tool calls send model-chosen arguments, which can carry patch text, to the
# server, so only add servers trusted with the code under review.
# See designs/DESIGN_MCP_CLIENT_TOOLS.md.
# [[mcp.servers]]
# name = "docs"                       # tools appear as mcp_docs_<tool>
# url = "https://mcp.example.com/mcp"
# bearer_token_env = "DOCS_MCP_TOKEN"  # token read from this variable
# allowed_tools = ["search", "read"]
# stages = ["hardware"]               # stages that see these tools
# prompt_hint = "Look up register definitions in the hardware documentation."
